name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm test
      - name: Example must exit 1 under --fail-on high
        shell: bash
        run: |
          set +e
          node dist/src/cli.js examples/sessions/demo-claude.jsonl --fail-on high > /dev/null
          test $? -eq 1
